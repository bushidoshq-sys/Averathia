name: Temporary custom Journey smoke v109c69
on:
  pull_request:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check app.js
      - name: Browser smoke at 390x844
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8123 >/tmp/averathia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > qa.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <pre id="result">WAIT</pre>
          <script>
          const h={
            name:"Custom Test",className:"Fighter",mechanicsClass:"Fighter",level:3,xp:5000,hp:20,maxhp:20,
            stats:{STR:16,DEX:14,CON:15,INT:10,WIS:12,CHA:11},gp:500,sp:0,cp:0,sex:"Male",avatar:0,
            inv:[{n:"Backpack",kind:"gear",can:false,eq:false}],rations:20,water:4,waterCapacity:4,
            lightStock:{torchMinutes:2000,oilMinutes:0,legacyMinutes:0},lightMinutes:2000,
            ammo:{Arrows:0,Quarrels:0,"Sling Stones":0},diseases:[],timedConditions:[],conditions:[],trophies:[],homeTier:0
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          const f=document.createElement("iframe");f.style="width:390px;height:844px";f.src="/index.html?qa=1";document.body.appendChild(f);
          f.onload=()=>setTimeout(()=>{
            const d=f.contentDocument;
            d.querySelector("#customDurationBtn").click();
            const hours=d.querySelector("#customHours"), mins=d.querySelector("#customMinutes");
            hours.value="3"; mins.value="30"; mins.dispatchEvent(new Event("input",{bubbles:true}));
            setTimeout(()=>{
              const customReq=d.querySelector("#requirements")?.textContent||"";
              const customVisible=!d.querySelector("#customDurationFields").classList.contains("hide");
              const customOn=d.querySelector("#customDurationBtn").classList.contains("on");
              d.querySelector('[data-min="60"]').click();
              setTimeout(()=>{
                result.textContent=JSON.stringify({
                  customVisible,customOn,
                  customReq,
                  presetReq:d.querySelector("#requirements")?.textContent||"",
                  customHiddenAfterPreset:d.querySelector("#customDurationFields").classList.contains("hide"),
                  oneHourOn:d.querySelector('[data-min="60"]').classList.contains("on"),
                  classes:d.querySelectorAll("[data-class]").length
                });
              },250);
            },250);
          },700);
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5500 --dump-dom http://127.0.0.1:8123/qa.html > /tmp/dom.txt
          grep -q '"customVisible":true' /tmp/dom.txt
          grep -q '"customOn":true' /tmp/dom.txt
          grep -q 'Needed for 210 min (84.0 AT h)' /tmp/dom.txt
          grep -q 'food 3.500 days' /tmp/dom.txt
          grep -q 'water 4 full skins' /tmp/dom.txt
          grep -q '"customHiddenAfterPreset":true' /tmp/dom.txt
          grep -q '"oneHourOn":true' /tmp/dom.txt
          grep -q 'Needed for 60 min (24.0 AT h)' /tmp/dom.txt
          grep -q '"classes":6' /tmp/dom.txt
