name: TEMP Turn XP smoke

on:
  pull_request:
    branches:
      - main

jobs:
  turn-xp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core
      - run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8000/index.html >/dev/null
      - run: |
          cat >/tmp/turn-xp.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.fill('#charName','Turn XP Tester');
            await page.click('[data-class="Cleric"]');
            await page.click('[data-av="0"]');
            await page.click('#chooseCharacter');
            await page.waitForSelector('#game:not(.hide)');

            const result=await page.evaluate(()=>{
              function setupTrip(){
                const now=Date.now();
                h.trip={journal:[],adventureLog:[],mission:{title:'Test',brief:'Test'},start:now,end:now+60000,half:now+30000,midBossDone:false,rcTreasureXpCP:0,mode:'present',risk:'Normal',durationMinutes:1,eventTarget:1,eventIntervalMs:60000,resourceModel:'at-elapsed-v2',resourceAt:now,nextEvent:now+60000};
                beginTripPause();
              }

              h.xp=0;h.level=1;h.stats.WIS=13;setupTrip();
              const ev1=CLERIC_EVENTS[0];h.pendingEvent=ev1;
              const originalRandom=Math.random;
              let seq=[0.99,0.99, 0.4,0.4,0.4,0.4, 0.99,0.99];
              Math.random=()=>seq.length?seq.shift():0.99;
              resolveTurnUndead(ev1);
              const ordinary={xp:h.xp,combat:!!h.combat,enemies:h.combat?.enemies?.length||0};
              h.combat=null;h.pendingEvent=null;h.trip=null;

              h.xp=0;h.level=4;h.stats.WIS=13;setupTrip();
              const ev2=CLERIC_EVENTS[1];h.pendingEvent=ev2;
              seq=[0.99,0.99, 0.4,0.4,0.4,0.4, 0.99,0.99, 0.99,0.99];
              Math.random=()=>seq.length?seq.shift():0.99;
              resolveTurnUndead(ev2);
              Math.random=originalRandom;
              const destroyed={xp:h.xp,combat:!!h.combat,enemies:h.combat?.enemies?.length||0};
              return {ordinary,destroyed};
            });

            console.log('TURN_XP_RESULT',JSON.stringify(result));
            assert.equal(result.ordinary.xp,0,'Successful non-D Turn must award 0 XP');
            assert.ok(result.destroyed.xp>0,'Destroyed undead must award normal monster XP');
            assert.deepEqual(errors,[],'Page errors: '+errors.join(' | '));
            console.log('TURN_XP_SMOKE_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH=$(npm root) node /tmp/turn-xp.cjs
