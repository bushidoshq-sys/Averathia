name: Temporary UI smoke v109c63
on:
  pull_request:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check app.js
      - name: Browser smoke at 390x844
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8123 >/tmp/averathia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > qa-classes.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <iframe id="f" src="/index.html" style="width:390px;height:844px"></iframe>
          <pre id="result">WAIT</pre>
          <script>
          f.onload=()=>{
            const d=f.contentDocument;
            const buttons=[...d.querySelectorAll("[data-class]")];
            const cleric=d.querySelector('[data-class="Cleric"]');
            cleric.click();
            setTimeout(()=>{
              result.textContent=JSON.stringify({
                count:buttons.length,
                clericSelected:cleric.classList.contains("on"),
                createVisible:!d.querySelector("#create").classList.contains("hide")
              });
            },250);
          };
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8123/qa-classes.html > /tmp/classes-dom.txt
          grep -q '"count":6' /tmp/classes-dom.txt
          grep -q '"clericSelected":true' /tmp/classes-dom.txt

          cat > qa-save.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>
          const h={
            name:"Rowena Thorne",className:"Cleric",mechanicsClass:"Cleric",level:8,xp:150119,
            hp:36,maxhp:39,stats:{STR:18,DEX:17,CON:17,INT:9,WIS:18,CHA:14},
            gp:259,sp:9,cp:8,sex:"Female",avatar:0,
            inv:[{n:"Backpack",kind:"gear",can:false,eq:false},{n:"Mace",kind:"weapon",can:true,eq:true},{n:"Shield",kind:"shield",can:true,eq:true}],
            rations:6.98,water:4,waterCapacity:4,
            lightStock:{torchMinutes:299.4,oilMinutes:0,legacyMinutes:0},lightMinutes:299.4,
            ammo:{Arrows:0,Quarrels:0,"Sling Stones":60},diseases:[],timedConditions:[],conditions:[],trophies:[]
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          location.replace("/index.html?qa-save=1");
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8123/qa-save.html > /tmp/save-dom.txt
          grep -q '<div class="sheetName">Rowena Thorne</div>' /tmp/save-dom.txt
          grep -q '<div class="sheetMeta">Human · Female · Cleric</div>' /tmp/save-dom.txt
          grep -q '259 GP</span>' /tmp/save-dom.txt
          grep -q '9 SP</span>' /tmp/save-dom.txt
          grep -q '8 CP</span>' /tmp/save-dom.txt
          grep -q 'class="topCarry ' /tmp/save-dom.txt
          grep -q 'Sling stones: 60' /tmp/save-dom.txt
          SHEET_LINE="$(grep -o '<div id="sheetResources"[^>]*>[^<]*</div>' /tmp/save-dom.txt | head -1)"
          test -n "$SHEET_LINE"
          ! grep -q 'Arrows:' <<<"$SHEET_LINE"
          ! grep -q 'Quarrels:' <<<"$SHEET_LINE"
          ! grep -q 'BP' <<<"$SHEET_LINE"
