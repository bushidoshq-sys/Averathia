name: Temporary secret doors smoke v109c71
on:
  pull_request:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check app.js
      - name: Browser smoke at 390x844
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8123 >/tmp/averathia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          run_case () {
            CLS="$1"
            SEX="$2"
            EXPECT="$3"
            FILE="$4"
            cat > "$FILE" <<EOF
          <!doctype html><meta charset="utf-8">
          <pre id="result">WAIT</pre>
          <script>
          const h={
            name:"QA Hero",className:"$CLS",mechanicsClass:"$CLS",level:2,xp:0,hp:10,maxhp:10,
            stats:{STR:12,DEX:12,CON:12,INT:12,WIS:12,CHA:12},gp:20,sp:0,cp:0,sex:"$SEX",avatar:0,
            inv:[{n:"Backpack",kind:"gear",can:false,eq:false}],rations:7,water:4,waterCapacity:4,
            lightStock:{torchMinutes:120,oilMinutes:0,legacyMinutes:0},ammo:{Arrows:0,Quarrels:0,"Sling Stones":0},
            diseases:[],timedConditions:[],conditions:[],trophies:[],homeTier:0
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          const f=document.createElement("iframe");f.style="width:390px;height:844px";f.src="/index.html?$CLS";document.body.appendChild(f);
          f.onload=()=>setTimeout(()=>{
            const d=f.contentDocument;
            const nav=d.querySelector("#skillsNav");
            nav.click();
            setTimeout(()=>{
              const cards=[...d.querySelectorAll("#skillsContent .skillCard")].map(x=>x.textContent.trim());
              result.textContent=JSON.stringify({
                navHidden:nav.classList.contains("hide"),
                secretCards:cards.filter(x=>x.startsWith("Find Secret Doors")),
                chance:cards.find(x=>x.startsWith("Find Secret Doors"))||"",
                classes:d.querySelectorAll("[data-class]").length
              });
            },250);
          },700);
          </script>
          EOF
            "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8123/$FILE" > "/tmp/$CLS-dom.txt"
            grep -o '<pre id="result">[^<]*</pre>' "/tmp/$CLS-dom.txt" || true
            grep -q '"navHidden":false' "/tmp/$CLS-dom.txt"
            grep -q "$EXPECT" "/tmp/$CLS-dom.txt"
            grep -q '"classes":6' "/tmp/$CLS-dom.txt"
          }

          run_case Fighter Male '1-in-6' qa-fighter.html
          grep -q '"secretCards":\["Find Secret Doors' /tmp/Fighter-dom.txt
          run_case Elf Female '1-in-3' qa-elf.html
          grep -q '"secretCards":\["Find Secret Doors' /tmp/Elf-dom.txt
          ! grep -q 'Find Secret Doors.*Find Secret Doors' /tmp/Elf-dom.txt
