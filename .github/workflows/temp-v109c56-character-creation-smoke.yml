name: temp-v109c56-character-creation-smoke
on:
  pull_request:
    branches: [main]

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run 390x844 character creation smoke
        run: |
          python3 -m http.server 4173 >/tmp/averathia-http.log 2>&1 &
          cat > character-creation-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));

          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await page.locator('[data-class="Arcanist"]').click();

          if(await page.locator('#bigAvatar').count()) throw new Error('Obsolete bigAvatar preview still exists');
          if(await page.locator('#previewLabel').count()) throw new Error('Obsolete previewLabel still exists');
          const bodyText=await page.locator('#create').innerText();
          if(/temporarily use Fighter mechanics/i.test(bodyText)) throw new Error('Obsolete Fighter mechanics text still visible');

          const avatars=page.locator('.avatarBtn');
          if(await avatars.count()!==3) throw new Error('Expected exactly 3 avatar choices');
          if(await page.locator('.avatarBtn.on').count()!==1) throw new Error('Exactly one avatar must be selected');
          if(await page.locator('.avatarBtn[aria-pressed="true"]').count()!==1) throw new Error('ARIA selection state missing');

          const first=page.locator('.avatarBtn').nth(0);
          const second=page.locator('.avatarBtn').nth(1);
          const t1=await first.locator('img').evaluate(el=>getComputedStyle(el).transform);
          const t2=await second.locator('img').evaluate(el=>getComputedStyle(el).transform);
          if(t1==='none'||t1===t2) throw new Error('Arcanist male 1 visual scale override missing: '+JSON.stringify({t1,t2}));

          await second.click();
          await page.waitForFunction(()=>document.querySelectorAll('.avatarBtn')[1]?.classList.contains('on'),null,{timeout:2000});
          if(await page.locator('.avatarBtn').nth(1).getAttribute('aria-pressed')!=='true') throw new Error('Selected ring did not move to second avatar');
          if(await page.locator('.avatarBtn.on').count()!==1) throw new Error('Multiple selected avatar rings after click');

          const metrics=await page.evaluate(()=>({
            viewport:innerWidth,
            scrollWidth:document.documentElement.scrollWidth,
            creationWidth:document.querySelector('#create .p')?.getBoundingClientRect().width||0,
            avatarButtons:[...document.querySelectorAll('.avatarBtn')].map(b=>({w:b.getBoundingClientRect().width,h:b.getBoundingClientRect().height}))
          }));
          if(metrics.scrollWidth>metrics.viewport+1) throw new Error('Horizontal overflow: '+JSON.stringify(metrics));
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));

          console.log('PASS',JSON.stringify({metrics,t1,t2}));
          await browser.close();
          EOF
          node character-creation-smoke.mjs
