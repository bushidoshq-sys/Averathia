name: Build Averathia Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Android launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("app/src/main/res/values/ic_launcher.png")
          im=Image.open(src).convert("RGBA")
          for folder,size in {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}.items():
              d=Path("app/src/main/res")/folder
              d.mkdir(parents=True,exist_ok=True)
              im.resize((size,size),Image.Resampling.LANCZOS).save(d/"ic_launcher.png")
          src.unlink()
          PY
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Averathia-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
