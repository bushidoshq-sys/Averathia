name: Temporary weapon slot smoke v109c71
on:
  pull_request:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check app.js
      - name: Browser smoke at 390x844
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8123 >/tmp/averathia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > qa.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <pre id="result">WAIT</pre>
          <script>
          const h={
            name:"Slot Test",className:"Fighter",mechanicsClass:"Fighter",level:3,xp:5000,hp:20,maxhp:20,
            stats:{STR:16,DEX:14,CON:15,INT:10,WIS:12,CHA:11},gp:500,sp:0,cp:0,sex:"Male",avatar:0,
            inv:[
              {n:"Backpack",kind:"gear",can:false,eq:false},
              {n:"Sword",kind:"weapon",can:true,eq:false},
              {n:"Long Bow",kind:"weapon",can:true,eq:false},
              {n:"Dagger",kind:"weapon",can:true,eq:false},
              {n:"Shield",kind:"shield",can:true,eq:false}
            ],
            rations:20,water:4,waterCapacity:4,lightStock:{torchMinutes:2000,oilMinutes:0,legacyMinutes:0},
            ammo:{Arrows:20,Quarrels:0,"Sling Stones":0},diseases:[],timedConditions:[],conditions:[],trophies:[],homeTier:0
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          const f=document.createElement("iframe");f.style="width:390px;height:844px";f.src="/index.html?qa=1";document.body.appendChild(f);
          f.onload=()=>setTimeout(()=>{
            const d=f.contentDocument;
            d.querySelector('[data-page="sheet"]').click();
            setTimeout(()=>{
              const rows=[...d.querySelectorAll("#sheetInv .sheetEquipRow")];
              const byName=n=>rows.find(r=>r.textContent.includes(n));
              const sword=byName("Sword"), bow=byName("Long Bow"), dagger=byName("Dagger");
              const buttons=r=>[...r.querySelectorAll("button")].map(b=>({text:b.textContent,slot:b.dataset.eqSlot||""}));
              result.textContent=JSON.stringify({
                sword:buttons(sword),
                bow:buttons(bow),
                dagger:buttons(dagger),
                classes:d.querySelectorAll("[data-class]").length
              });
            },300);
          },700);
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8123/qa.html > /tmp/dom.txt
          grep -q '"sword":\[{"text":"Melee","slot":"melee"}\]' /tmp/dom.txt
          grep -q '"bow":\[{"text":"Ranged","slot":"ranged"}\]' /tmp/dom.txt
          grep -q '"dagger":\[{"text":"Melee","slot":"melee"},{"text":"Ranged","slot":"ranged"}\]' /tmp/dom.txt
          grep -q '"classes":6' /tmp/dom.txt
