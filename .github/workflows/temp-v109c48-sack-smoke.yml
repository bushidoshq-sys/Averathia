name: temp-v109c48-sack-smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run mobile sack smoke
        run: |
          node --check app.js
          python3 -m http.server 8000 >/tmp/averathia-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            if(errors.length)throw new Error('Load errors: '+errors.join(' | '));
            await page.click('#chooseCharacter');

            const defs=await page.evaluate(()=>{
              const f=GEAR_KEY_EVENTS.find(x=>x.id==='GEAR-018');
              const o=GEAR_KEY_EVENTS.find(x=>x.id==='GEAR-019');
              return {
                farmer:!!f,
                ore:!!o,
                farmerLabels:f?.choices.map(x=>x.label),
                oreLabels:o?.choices.map(x=>x.label)
              };
            });
            assert(defs.farmer&&defs.ore,'new events missing');

            const farmerSmall=await page.evaluate(()=>{
              h.gp=0;h.sp=0;h.cp=0;h.inv=[{n:'Small Sack',kind:'gear',eventKey:true},{n:'Backpack',kind:'gear'}];
              h.trip={journal:[],adventureLog:[],mode:'present'};
              const ev=GEAR_KEY_EVENTS.find(x=>x.id==='GEAR-018');
              applyEventChoice(ev,ev.choices[0]);
              return {hasSmall:hasInventoryItem('Small Sack'),wallet:walletCP(),journal:h.trip.journal.at(-1)};
            });
            assert(!farmerSmall.hasSmall&&farmerSmall.wallet===200,'Small Sack farmer payout/removal wrong: '+JSON.stringify(farmerSmall));

            const farmerLarge=await page.evaluate(()=>{
              h.gp=0;h.sp=0;h.cp=0;h.inv=[{n:'Large Sack',kind:'gear',eventKey:true},{n:'Backpack',kind:'gear'}];
              h.trip={journal:[],adventureLog:[],mode:'present'};
              const ev=GEAR_KEY_EVENTS.find(x=>x.id==='GEAR-018');
              applyEventChoice(ev,ev.choices[1]);
              return {hasLarge:hasInventoryItem('Large Sack'),wallet:walletCP()};
            });
            assert(!farmerLarge.hasLarge&&farmerLarge.wallet===400,'Large Sack farmer payout/removal wrong: '+JSON.stringify(farmerLarge));

            const smallOre=await page.evaluate(()=>{
              h.gp=0;h.sp=0;h.cp=0;h.inv=[{n:'Small Sack',kind:'gear',eventKey:true},{n:'Backpack',kind:'gear'}];
              h.trip={journal:[],adventureLog:[],mode:'present'};
              const ev=GEAR_KEY_EVENTS.find(x=>x.id==='GEAR-019');
              applyEventChoice(ev,ev.choices[0]);
              const q=h.inv.find(x=>x.oreSack);
              const farmer=GEAR_KEY_EVENTS.find(x=>x.id==='GEAR-018');
              return {name:q?.n,eventKey:q?.eventKey,bp:itemBulkPoints(q),smallEmpty:hasInventoryItem('Small Sack'),farmerSmallAvailable:eventChoiceAvailable(farmer.choices[0]),price:sellPriceCP(q),desc:sellDescriptor(q)};
            });
            assert(smallOre.name==='Small Sack of Ore'&&!smallOre.eventKey&&smallOre.bp===1&&!smallOre.smallEmpty&&!smallOre.farmerSmallAvailable&&smallOre.price===500,'Small ore conversion wrong: '+JSON.stringify(smallOre));

            const smallSale=await page.evaluate(()=>{
              h.trip=null;let i=h.inv.findIndex(x=>x.oreSack);sell(i);
              const q=h.inv.find(x=>x.n==='Small Sack');
              return {wallet:walletCP(),returned:!!q,eventKey:q?.eventKey};
            });
            assert(smallSale.wallet===500&&smallSale.returned&&smallSale.eventKey,'Small ore sale/return wrong: '+JSON.stringify(smallSale));

            const largeOreSale=await page.evaluate(()=>{
              h.gp=0;h.sp=0;h.cp=0;h.inv=[{n:'Large Sack',kind:'gear',eventKey:true},{n:'Backpack',kind:'gear'}];
              h.trip={journal:[],adventureLog:[],mode:'present'};
              const ev=GEAR_KEY_EVENTS.find(x=>x.id==='GEAR-019');applyEventChoice(ev,ev.choices[1]);
              let q=h.inv.find(x=>x.oreSack),filled={name:q?.n,bp:itemBulkPoints(q),price:sellPriceCP(q),key:q?.eventKey};
              h.trip=null;let i=h.inv.findIndex(x=>x.oreSack);sell(i);
              let back=h.inv.find(x=>x.n==='Large Sack');
              return {filled,wallet:walletCP(),returned:!!back,eventKey:back?.eventKey};
            });
            assert(largeOreSale.filled.name==='Large Sack of Ore'&&largeOreSale.filled.bp===5&&largeOreSale.filled.price===1000&&!largeOreSale.filled.key,'Large ore conversion wrong: '+JSON.stringify(largeOreSale));
            assert(largeOreSale.wallet===1000&&largeOreSale.returned&&largeOreSale.eventKey,'Large ore sale/return wrong: '+JSON.stringify(largeOreSale));

            await page.click('[data-page="shop"]');
            assert(errors.length===0,'Page errors: '+errors.join(' | '));
            console.log('SACK SMOKE PASS',JSON.stringify({defs,farmerSmall,farmerLarge,smallOre,smallSale,largeOreSale}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
