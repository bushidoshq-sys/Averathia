name: Temporary top identity smoke v109c65
on:
  pull_request:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check app.js
      - name: Browser smoke at 390x844
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8123 >/tmp/averathia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > qa.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <pre id="result">WAIT</pre>
          <script>
          const h={
            name:"Rowena Thorne",className:"Cleric",mechanicsClass:"Cleric",level:8,xp:150119,
            hp:36,maxhp:39,stats:{STR:18,DEX:17,CON:17,INT:9,WIS:18,CHA:14},
            gp:259,sp:9,cp:8,sex:"Female",avatar:0,
            inv:[{n:"Backpack",kind:"gear",can:false,eq:false},{n:"Mace",kind:"weapon",can:true,eq:true},{n:"Shield",kind:"shield",can:true,eq:true}],
            rations:6.98,water:4,waterCapacity:4,
            lightStock:{torchMinutes:299.4,oilMinutes:0,legacyMinutes:0},lightMinutes:299.4,
            ammo:{Arrows:0,Quarrels:0,"Sling Stones":60},diseases:[],timedConditions:[],conditions:[],trophies:[],homeTier:1,homeStorage:[],homeCoins:{gp:0,sp:0,cp:0}
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          const f=document.createElement("iframe");f.style="width:390px;height:844px";f.src="/index.html?qa=1";document.body.appendChild(f);
          f.onload=()=>setTimeout(()=>{
            const d=f.contentDocument;
            result.textContent=JSON.stringify({
              classes:d.querySelectorAll("[data-class]").length,
              topName:d.querySelector(".topName")?.textContent||"",
              topMeta:d.querySelector(".topMeta")?.textContent||"",
              sheetDataNodes:d.querySelectorAll("#sheetData").length,
              sheetHasName:[...d.querySelectorAll("#sheet *")].some(x=>x.textContent==="Rowena Thorne"),
              createHidden:d.querySelector("#create")?.classList.contains("hide")
            });
          },700);
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8123/qa.html > /tmp/dom.txt
          grep -q '"classes":6' /tmp/dom.txt
          grep -q '"topName":"Rowena Thorne"' /tmp/dom.txt
          grep -q '"topMeta":"Human · Female · Cleric · Level 8"' /tmp/dom.txt
          grep -q '"sheetDataNodes":0' /tmp/dom.txt
          grep -q '"sheetHasName":false' /tmp/dom.txt
          grep -q '"createHidden":true' /tmp/dom.txt
