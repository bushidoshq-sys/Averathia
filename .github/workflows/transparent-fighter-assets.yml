name: Restore original Fighter assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/transparent-fighter-assets.yml"

permissions:
  contents: write

jobs:
  restore-fighters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original Fighter assets
        run: |
          git checkout b3854cde4553dc5123fbea4de07ebb3d269df10c -- \
            fighter_male_1_full.png fighter_male_1_head.png fighter_male_1_sprite.png \
            fighter_male_2_full.png fighter_male_2_head.png fighter_male_2_sprite.png \
            fighter_male_3_full.png fighter_male_3_head.png fighter_male_3_sprite.png \
            fighter_female_1_full.png fighter_female_1_head.png fighter_female_1_sprite.png \
            fighter_female_2_full.png fighter_female_2_head.png fighter_female_2_sprite.png \
            fighter_female_3_full.png fighter_female_3_head.png fighter_female_3_sprite.png

      - name: Package originals
        run: |
          zip -j fighter_male_originals.zip fighter_male_*_*.png
          zip -j fighter_female_originals.zip fighter_female_*_*.png

      - name: Upload Fighter Male originals
        uses: actions/upload-artifact@v4
        with:
          name: fighter-male-originals
          path: fighter_male_originals.zip

      - name: Upload Fighter Female originals
        uses: actions/upload-artifact@v4
        with:
          name: fighter-female-originals
          path: fighter_female_originals.zip

      - name: Restore originals in main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fighter_male_*_*.png fighter_female_*_*.png
          if git diff --cached --quiet; then
            echo "Assets already restored."
            exit 0
          fi
          git commit -m "Restore original Fighter assets"
          git push
