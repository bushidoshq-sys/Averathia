name: TEMP Turn Undead repro

on:
  pull_request:
    branches:
      - main

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core
      - run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8000/index.html >/dev/null
      - run: |
          cat >/tmp/repro.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const fs=require('node:fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.fill('#charName','Turn Tester');
            await page.click('[data-class="Cleric"]');
            await page.click('[data-av="0"]');
            await page.click('#chooseCharacter');
            await page.waitForSelector('#game:not(.hide)');

            await page.evaluate(()=>{
              h.rations=7;h.waterCapacity=4;h.water=4;h.lightStock={torchMinutes:600,oilMinutes:0,legacyMinutes:0};
              const now=Date.now();
              h.trip={journal:[],adventureLog:[],mission:{title:'Test',brief:'Test',bossWon:false,resolved:false},start:now,end:now+60000,half:now+30000,midBossDone:false,rcTreasureXpCP:0,mode:'present',risk:'Normal',durationMinutes:1,eventTarget:1,eventIntervalMs:60000,resourceModel:'at-elapsed-v2',resourceAt:now,forcedReturnWater:false,nextEvent:now+60000};
              const ev=CLERIC_EVENTS[0];
              beginTripPause();
              h.pendingEvent=ev;
              renderPendingEvent();
              save();
              const oldD=d;
              d=(n)=>n===100?50:n===4?4:n===8?4:n===6?1:1;
              window.__restoreD=()=>{d=oldD};
            });
            await page.waitForSelector('#eventChoice:not(.hide)');
            const eventBefore=await page.locator('#eventChoice').innerText();
            console.log('EVENT_BEFORE',eventBefore.replace(/\s+/g,' '));
            await page.getByRole('button',{name:'Turn Undead'}).click();
            await page.waitForTimeout(300);

            const state=await page.evaluate(()=>({
              combat:!!h.combat,
              enemies:h.combat?.enemies?.length||0,
              currentVisiblePages:[...document.querySelectorAll('.page:not(.hide)')].map(x=>x.id),
              combatHidden:document.getElementById('combat').classList.contains('hide'),
              departHidden:document.getElementById('depart').classList.contains('hide'),
              eventHidden:document.getElementById('eventChoice').classList.contains('hide'),
              combatLog:document.getElementById('combatLog').innerText,
              adventureLog:document.getElementById('adventureLogEntries').innerText,
              tripMode:h.trip?.mode,
              pauseStart:h.trip?.pauseStart||null
            }));
            console.log('STATE_AFTER',JSON.stringify(state,null,2));
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH=$(npm root) node /tmp/repro.cjs
