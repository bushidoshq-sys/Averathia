name: Temporary Journey Log smoke v109c64
on:
  pull_request:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check app.js
      - name: Browser smoke at 390x844
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8123 >/tmp/averathia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > qa-no-room.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <pre id="result">WAIT</pre>
          <script>
          const h={
            name:"NoRoom Test",className:"Cleric",mechanicsClass:"Cleric",level:2,xp:0,hp:10,maxhp:10,
            stats:{STR:12,DEX:12,CON:12,INT:12,WIS:16,CHA:12},gp:50,sp:0,cp:0,sex:"Female",avatar:0,
            inv:[{n:"Backpack",kind:"gear",can:false,eq:false}],rations:7,water:1,waterCapacity:1,
            lightStock:{torchMinutes:60,oilMinutes:0,legacyMinutes:0},ammo:{Arrows:0,Quarrels:0,"Sling Stones":0},
            diseases:[],timedConditions:[],conditions:[],trophies:[],homeTier:0,
            lastAdventure:"OLD LOG MUST DISAPPEAR",lastAdventureTitle:"Old Journey"
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          const f=document.createElement("iframe");f.style="width:390px;height:844px";f.src="/index.html?no-room=1";document.body.appendChild(f);
          f.onload=()=>setTimeout(()=>{
            const d=f.contentDocument, saved=JSON.parse(localStorage.getItem("averathia-v041")||"{}");
            result.textContent=JSON.stringify({
              classes:d.querySelectorAll("[data-class]").length,
              logNodes:d.querySelectorAll("#lastAdventure").length,
              homeContainsLog:d.querySelector("#homeContent")?.querySelector("#lastAdventure")!==null,
              savedLog:saved.lastAdventure??null,
              createHidden:d.querySelector("#create")?.classList.contains("hide")
            });
          },600);
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=4500 --dump-dom http://127.0.0.1:8123/qa-no-room.html > /tmp/no-room.txt
          grep -q '"classes":6' /tmp/no-room.txt
          grep -q '"logNodes":0' /tmp/no-room.txt
          grep -q '"homeContainsLog":false' /tmp/no-room.txt
          grep -q '"savedLog":null' /tmp/no-room.txt
          grep -q '"createHidden":true' /tmp/no-room.txt

          cat > qa-room.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <pre id="result">WAIT</pre>
          <script>
          const h={
            name:"Room Test",className:"Cleric",mechanicsClass:"Cleric",level:2,xp:0,hp:10,maxhp:10,
            stats:{STR:12,DEX:12,CON:12,INT:12,WIS:16,CHA:12},gp:50,sp:0,cp:0,sex:"Female",avatar:0,
            inv:[{n:"Backpack",kind:"gear",can:false,eq:false}],rations:7,water:1,waterCapacity:1,
            lightStock:{torchMinutes:60,oilMinutes:0,legacyMinutes:0},ammo:{Arrows:0,Quarrels:0,"Sling Stones":0},
            diseases:[],timedConditions:[],conditions:[],trophies:[],homeTier:1,homeStorage:[],homeCoins:{gp:0,sp:0,cp:0},
            lastAdventure:"ROOM LOG VISIBLE",lastAdventureTitle:"Test Journey"
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          const f=document.createElement("iframe");f.style="width:390px;height:844px";f.src="/index.html?room=1";document.body.appendChild(f);
          f.onload=()=>setTimeout(()=>{
            const d=f.contentDocument, log=d.querySelector("#lastAdventure");
            result.textContent=JSON.stringify({
              logNodes:d.querySelectorAll("#lastAdventure").length,
              homeContainsLog:d.querySelector("#homeContent")?.querySelector("#lastAdventure")!==null,
              logText:d.querySelector("#lastAdventureText")?.textContent||"",
              logTitle:d.querySelector("#lastAdventureSummary")?.textContent||"",
              outsideHome:!!log&&!d.querySelector("#homeContent").contains(log)
            });
          },600);
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=4500 --dump-dom http://127.0.0.1:8123/qa-room.html > /tmp/room.txt
          grep -q '"logNodes":1' /tmp/room.txt
          grep -q '"homeContainsLog":true' /tmp/room.txt
          grep -q '"logText":"ROOM LOG VISIBLE"' /tmp/room.txt
          grep -q '"logTitle":"📖 Test Journey"' /tmp/room.txt
          grep -q '"outsideHome":false' /tmp/room.txt
