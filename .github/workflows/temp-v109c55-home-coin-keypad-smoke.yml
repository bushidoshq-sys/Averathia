name: temp-v109c55-home-coin-keypad-smoke
on:
  pull_request:
    branches: [main]

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run 390x844 Home coin keypad smoke
        run: |
          python3 -m http.server 4173 >/tmp/averathia-http.log 2>&1 &
          cat > home-coin-keypad-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));

          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await page.evaluate(()=>{
            localStorage.setItem('averathia-v041',JSON.stringify({
              name:'Coin Keypad Test',className:'Cleric',mechanicsClass:'Cleric',
              level:6,xp:0,maxhp:12,hp:12,
              stats:{STR:15,DEX:12,CON:14,INT:10,WIS:18,CHA:13},
              gp:0,gold:0,sp:0,cp:0,
              homeTier:1,homeCoins:{gp:100,sp:0,cp:0},homeStorage:[],
              inv:[{n:'Backpack',kind:'gear',can:false,eq:false}],
              spells:{used:{},buffs:[],memorized:{1:['cure_light'],2:[],3:[]},spentMem:[]}
            }));
          });
          await page.reload({waitUntil:'networkidle'});
          await page.locator('[data-page="home"]').click();
          await page.waitForSelector('#home:not(.hide)');

          if(await page.locator('[data-home-coin-mode="take"]').getAttribute('class')!=='on') throw new Error('Take should be default mode');
          for(const k of ['5']) await page.locator('[data-home-coin-key="'+k+'"]').click();
          await page.locator('#homeCoinConfirm').click();

          let state=await page.evaluate(()=>JSON.parse(localStorage.getItem('averathia-v041')));
          if(state.gp!==5||state.homeCoins.gp!==95) throw new Error('Exact take failed: '+JSON.stringify({gp:state.gp,home:state.homeCoins}));

          await page.locator('[data-home-coin-mode="store"]').click();
          await page.locator('[data-home-coin-preset="half"]').click();
          let input=await page.locator('#homeCoinAmountInput').inputValue();
          if(input!=='2') throw new Error('Half preset expected 2 from 5 GP, got '+input);
          await page.locator('#homeCoinConfirm').click();

          state=await page.evaluate(()=>JSON.parse(localStorage.getItem('averathia-v041')));
          if(state.gp!==3||state.homeCoins.gp!==97) throw new Error('Half store failed: '+JSON.stringify({gp:state.gp,home:state.homeCoins}));

          await page.locator('[data-home-coin-preset="all"]').click();
          input=await page.locator('#homeCoinAmountInput').inputValue();
          if(input!=='3') throw new Error('All preset expected 3 GP, got '+input);
          await page.locator('#homeCoinConfirm').click();

          state=await page.evaluate(()=>JSON.parse(localStorage.getItem('averathia-v041')));
          if(state.gp!==0||state.homeCoins.gp!==100) throw new Error('All store failed: '+JSON.stringify({gp:state.gp,home:state.homeCoins}));

          await page.locator('[data-home-coin-mode="take"]').click();
          await page.locator('#homeCoinAmountInput').fill('7');
          if(await page.locator('#homeCoinConfirm').isDisabled()) throw new Error('Typed valid amount should enable confirm');
          await page.locator('#homeCoinConfirm').click();
          state=await page.evaluate(()=>JSON.parse(localStorage.getItem('averathia-v041')));
          if(state.gp!==7||state.homeCoins.gp!==93) throw new Error('Typed exact take failed: '+JSON.stringify({gp:state.gp,home:state.homeCoins}));

          const metrics=await page.evaluate(()=>({
            viewport:innerWidth,
            scrollWidth:document.documentElement.scrollWidth,
            panelWidth:document.querySelector('.homeCoinPanel')?.getBoundingClientRect().width||0,
            keypadButtons:[...document.querySelectorAll('.homeCoinKeypad button')].map(b=>({w:b.getBoundingClientRect().width,h:b.getBoundingClientRect().height}))
          }));
          if(metrics.scrollWidth>metrics.viewport+1) throw new Error('Horizontal overflow: '+JSON.stringify(metrics));
          if(metrics.keypadButtons.some(b=>b.h<44||b.w<44)) throw new Error('Keypad touch target too small: '+JSON.stringify(metrics));
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));

          console.log('PASS',JSON.stringify(metrics));
          await browser.close();
          EOF
          node home-coin-keypad-smoke.mjs
