name: temp-v109c47-home-smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run mobile Home smoke
        run: |
          python3 -m http.server 8000 >/tmp/averathia-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.click('#chooseCharacter');

            const initial=await page.evaluate(()=>{
              h.stats.CHA=9;h.gp=100000;h.sp=0;h.cp=10;ensureHomeState();refresh();
              return {
                tier:homeTier(),homeText:document.querySelector('#homeContent').innerText,
                retainerHidden:document.querySelector('#retainerNav').classList.contains('hide'),
                stableVisible:document.querySelector('#homeContent').innerText.includes('Stable'),
                places:[['Fighter','Training Yard'],['Cleric','Private Shrine'],['Arcanist','Private Library'],['Thief','Hidden Room'],['Dwarf','Workshop'],['Elf','Private Grove']].every(([k,v])=>{let old=h.className;h.className=k;let ok=homePlaceName()===v;h.className=old;return ok})
              };
            });
            assert(initial.tier===0,'initial Home tier wrong');
            assert(!initial.stableVisible,'Stable visible before House');
            assert(initial.retainerHidden,'Retainer visible before Estate');
            assert(initial.places,'class property names wrong');

            const wellPaid=await page.evaluate(()=>{
              h.waterCapacity=1;h.water=0;h.gp=0;h.sp=0;h.cp=10;Math.random=()=>.5;refresh();fillWaterskinsManual();
              return {water:h.water,cp:h.cp,gp:h.gp,status:document.querySelector('#wellMsg').innerText};
            });
            assert(wellPaid.water===1&&wellPaid.cp===8,'public well did not cost 2 CP');

            const room=await page.evaluate(()=>{
              h.gp=100000;h.sp=0;h.cp=0;buyHomeUpgrade();refresh();
              return {tier:homeTier(),stable:document.querySelector('#homeContent').innerText.includes('Stable'),storage:document.querySelector('#homeContent').innerText.includes('Home Storage')};
            });
            assert(room.tier===1&&room.storage&&!room.stable,'Room features wrong');

            const storage=await page.evaluate(()=>{
              h.inv.push({n:'Smoke Boulder',kind:'gear',can:false,eq:false,rcEncumbrance:500});
              let before=carriedBulkPoints(),idx=h.inv.findIndex(x=>x.n==='Smoke Boulder');storeAtHome(idx);let after=carriedBulkPoints();
              return {before,after,stored:h.homeStorage.some(x=>x.n==='Smoke Boulder')};
            });
            assert(storage.stored&&Math.abs((storage.before-storage.after)-500)<.001,'Home storage did not remove BP');

            const house=await page.evaluate(()=>{
              buyHomeUpgrade();h.water=0;refresh();let before=walletCP();Math.random=()=>.5;fillWaterskinsManual();let after=walletCP();refresh();
              return {tier:homeTier(),stable:document.querySelector('#homeContent').innerText.includes('Stable'),place:document.querySelector('#homeContent').innerText.includes('Training Yard'),water:h.water,wellCost:before-after,retainerHidden:document.querySelector('#retainerNav').classList.contains('hide')};
            });
            assert(house.tier===2&&house.stable&&house.place,'House missing Stable/property place');
            assert(house.water===1&&house.wellCost===0,'House well was not free');
            assert(house.retainerHidden,'Retainer visible at House');

            const horse=await page.evaluate(()=>{
              h.gp=1000;h.sp=0;h.cp=0;h.stats.CHA=9;let b=walletCP();buyHorse();let hCost=b-walletCP();b=walletCP();buyMountFeed(1);let fCost=b-walletCP();
              return {horses:h.mounts.horses,feed:h.mounts.feedDays,hCost,fCost};
            });
            assert(horse.horses===1&&horse.hCost===7500,'Riding Horse purchase wrong');
            assert(horse.feed===7&&horse.fCost===1000,'Mount Feed purchase wrong');

            const estate=await page.evaluate(()=>{
              h.gp=100000;h.sp=0;h.cp=0;buyHomeUpgrade();h.water=0;h.rations=0;h.mounts.feedDays=0;h.mounts.horses=2;h.retainer.autoWater=true;h.retainer.autoRation=true;h.retainer.autoFeed=true;h.retainer.takeOnJourney=true;h.stats.CHA=9;let before=walletCP();home();refresh();
              return {tier:homeTier(),retainerHidden:document.querySelector('#retainerNav').classList.contains('hide'),water:h.water,rations:h.rations,feed:h.mounts.feedDays,spent:before-walletCP(),carry:maxCarryBP()};
            });
            assert(estate.tier===3&&!estate.retainerHidden,'Estate did not reveal Retainer');
            assert(estate.water===1&&estate.rations===7&&estate.feed===14,'Retainer automation failed: '+JSON.stringify(estate));
            assert(estate.spent===2500,'Retainer automation cost wrong: '+estate.spent);
            assert(estate.carry>=3200,'Retainer carry BP missing: '+estate.carry);

            const mounts=await page.evaluate(()=>{
              h.mounts.useOnJourney=true;h.retainer.takeOnJourney=true;h.mounts.horses=1;let one=plannedHorseCount();h.mounts.horses=2;let two=plannedHorseCount();return{one,two}
            });
            assert(mounts.one===0&&mounts.two===2,'Retainer mount requirement wrong');

            const encounter=await page.evaluate(()=>{
              const oldRand=Math.random;
              h.trip={journal:[],mountedTravel:true,retainer:false};Math.random=()=>.29;let mountedType=pickEvent().type;
              h.trip={journal:[],mountedTravel:false,retainer:false};Math.random=()=>.29;let footType=pickEvent().type;
              Math.random=oldRand;return{mountedType,footType}
            });
            assert(encounter.mountedType==='Decision'&&encounter.footType==='Encounter','Mounted encounter weighting wrong: '+JSON.stringify(encounter));

            const consume=await page.evaluate(()=>{
              let now=Date.now();h.rations=10;h.water=10;h.waterCapacity=10;h.mounts.feedDays=10;
              h.trip={start:now-3600000,end:now+1000,half:now-1800000,resourceModel:'at-elapsed-v2',resourceAt:now-3600000,retainer:true,mountsUsed:2,forcedReturnWater:false,journal:[],adventureLog:[]};
              consumeTripSurvivalResources(now);
              return{rations:h.rations,water:h.water,feed:h.mounts.feedDays}
            });
            assert(Math.abs(consume.rations-8)<.01&&Math.abs(consume.water-6)<.01&&Math.abs(consume.feed-8)<.01,'Journey support consumption wrong: '+JSON.stringify(consume));

            assert(errors.length===0,'Page errors: '+errors.join(' | '));
            console.log('SMOKE PASS',JSON.stringify({initial,wellPaid,room,storage,house,horse,estate,mounts,encounter,consume}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
