name: Temporary weapon lookup smoke v109c71
on:
  pull_request:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check app.js
      - name: Browser smoke at 390x844
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8123 >/tmp/averathia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > qa-weapon.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <pre id="result">WAIT</pre>
          <script>
          const h={
            name:"Brynja Thorne",className:"Elf",mechanicsClass:"Elf",level:1,xp:0,hp:6,maxhp:6,
            stats:{STR:12,DEX:16,CON:12,INT:12,WIS:12,CHA:16},gp:54,sp:3,cp:7,sex:"Female",avatar:0,
            inv:[
              {n:"Backpack",kind:"gear",can:false,eq:false},
              {n:"Banded Mail",kind:"armor",can:true,eq:true},
              {n:"Long Bow",kind:"weapon",can:true,eq:true},
              {n:"Sword",kind:"weapon",can:true,eq:true}
            ],
            rations:7,water:4,waterCapacity:4,
            lightStock:{torchMinutes:299.4,oilMinutes:0,legacyMinutes:0},ammo:{Arrows:20,Quarrels:0,"Sling Stones":0},
            diseases:[],timedConditions:[],conditions:[],trophies:[],homeTier:0
          };
          localStorage.setItem("averathia-v041",JSON.stringify(h));
          const f=document.createElement("iframe");f.style="width:390px;height:844px";f.src="/index.html?qa=weapon";document.body.appendChild(f);
          f.onload=()=>setTimeout(()=>{
            const d=f.contentDocument;
            d.querySelector('[data-page="sheet"]').click();
            setTimeout(()=>{
              result.textContent=JSON.stringify({
                topMeta:d.querySelector(".topMeta")?.textContent||"",
                combat:d.querySelector("#sheetInv .combatSummary")?.textContent||"",
                swordEquipped:[...d.querySelectorAll("#sheetInv .sheetEquipRow")].some(x=>x.textContent.includes("✓ Sword")),
                bowEquipped:[...d.querySelectorAll("#sheetInv .sheetEquipRow")].some(x=>x.textContent.includes("✓ Long Bow")),
                classes:d.querySelectorAll("[data-class]").length
              });
            },250);
          },700);
          </script>
          EOF
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8123/qa-weapon.html > /tmp/dom.txt
          grep -q '"topMeta":"Elf · Female · Level 1"' /tmp/dom.txt
          grep -q 'Combat: Long Bow (1d6) · AC 2' /tmp/dom.txt
          grep -q '"swordEquipped":true' /tmp/dom.txt
          grep -q '"bowEquipped":true' /tmp/dom.txt
          grep -q '"classes":6' /tmp/dom.txt
